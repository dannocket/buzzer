<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Buzzer</title>
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body class="page-user">
    <h1>Ash & Dan's Halloween Jeopardy</h1>
    <div id="registrationForm">
      <h2>Register Your Name</h2>
      <form id="team-registration-form">
        <label for="team-name-input">Name</label>
        <input
          type="text"
          id="team-name-input"
          name="team-name"
          placeholder="Enter team name"
        />
        <button type="submit" id="register-button">Register</button>
      </form>
    </div>
    <div id="buzzerContainer">
      <div id="teamNameContainer">
        <span id="teamNameDisplay"></span>
        <span id="changeRegistration">&#x270E;</span>
      </div>
      <div id="teamDescriptionContainer"></div>
      <button id="buzzer-button">BUZZ!</button>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      let teamName = "";
      let teamPin = "";
      let lastBuzzTime = 0;
      let reconnectionInterval;
      const buzzerButton = document.getElementById("buzzer-button");

      let wakeLock = null;

      // The Wake Lock API needs a secure context (HTTPS or localhost), so it
      // is unavailable when the server is reached by LAN IP over plain HTTP.
      async function preventSleep() {
        if (!("wakeLock" in navigator)) {
          return;
        }
        try {
          wakeLock = await navigator.wakeLock.request("screen");
          console.log("Wake lock is active");
        } catch (err) {
          console.error(`Error acquiring wake lock: ${err}`);
        }
      }

      // The browser releases the lock whenever the page is hidden.
      document.addEventListener("visibilitychange", () => {
        if (
          document.visibilityState === "visible" &&
          (!wakeLock || wakeLock.released)
        ) {
          preventSleep();
        }
      });

      preventSleep();

      function registerTeam() {
        teamName = document.getElementById("team-name-input").value.trim();
        if (teamName) {
          document.getElementById("team-name-input").disabled = true;
          document.getElementById("register-button").disabled = true;
          fetch("/register", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              teamName,
              socketId: socket.id,
            }),
          })
            .then((response) => response.json())
            .then((data) => {
              if (data.success) {
                teamPin = data.pin;
                localStorage.setItem("teamName", teamName);
                localStorage.setItem("teamPin", teamPin);
              } else {
                alert("Registration failed: " + data.error);
                document.getElementById("team-name-input").disabled = false;
                document.getElementById("register-button").disabled = false;
              }
            });
        }
      }

      function attemptReconnection() {
        if (!socket.connected) {
          reRegister();
        } else {
          clearInterval(reconnectionInterval);
        }
      }

      socket.on("registrationApproved", (data) =>
        showBuzzer(data.teamName, data.description)
      );
      socket.on("registrationRemoved", (data) =>
        showRegistrationForm(data.teamName)
      );
      // Keep the stored name in sync so later name change requests match.
      function setTeamName(newName) {
        teamName = newName;
        localStorage.setItem("teamName", newName);
      }
      socket.on("teamUpdated", (team) => {
        setTeamName(team.teamName);
        showBuzzer(team.teamName, team.description, null);
      });
      socket.on("nameChange", ({ newName }) => {
        setTeamName(newName);
        document.getElementById("teamNameDisplay").textContent = newName;
      });
      function showBuzzer(teamName, description = "", hasPressed = false) {
        document.getElementById("registrationForm").style.display = "none";
        document.getElementById("buzzerContainer").style.display = "block";
        document.getElementById("teamNameDisplay").textContent = teamName;
        document.getElementById("teamDescriptionContainer").textContent =
          description;
        if (null !== hasPressed) {
          buzzerButton.disabled = hasPressed;
        }
      }
      function showRegistrationForm(teamName = "") {
        document.getElementById("buzzerContainer").style.display = "none";
        document.getElementById("registrationForm").style.display = "block";
        const teamNameInput = document.getElementById("team-name-input");
        teamNameInput.value = teamName;
        teamNameInput.disabled = false;
        document.getElementById("register-button").disabled = false;
      }
      function reRegister() {
        teamName = localStorage.getItem("teamName");
        teamPin = localStorage.getItem("teamPin");
        if (teamName && teamPin) {
          fetch("/reRegister", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              teamName,
              pin: teamPin,
              socketId: socket.id,
            }),
          })
            .then((response) => response.json())
            .then((data) => {
              if (data.success) {
                setTeamName(data.teamName);
                showBuzzer(data.teamName, data.description, data.hasPressed);
              } else {
                showRegistrationForm(teamName);
              }
            });
        } else {
          showRegistrationForm();
        }
      }
      function buzz() {
        const now = Date.now();
        if (now - lastBuzzTime > 1000) {
          lastBuzzTime = now;
          socket.emit("buzzerPress", {
            pin: teamPin,
            teamName,
          });
          buzzerButton.disabled = true;
          if ("vibrate" in navigator) {
            navigator.vibrate(200);
          }
        }
      }
      document
        .getElementById("team-registration-form")
        .addEventListener("submit", (event) => {
          event.preventDefault();
          registerTeam();
        });
      // Buzz on press rather than release so timing is fair. pointerdown
      // covers mouse, touch and pen; keyboard activation arrives as a click
      // with detail 0.
      buzzerButton.addEventListener("pointerdown", buzz);
      buzzerButton.addEventListener("click", (event) => {
        if (event.detail === 0) {
          buzz();
        }
      });
      socket.on("reset", () => {
        buzzerButton.disabled = false;
        lastBuzzTime = 0;
      });
      document
        .getElementById("changeRegistration")
        .addEventListener("click", () => {
          const newName = prompt("Enter new team name:");
          if (newName && newName !== teamName) {
            fetch("/changeTeamName", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                oldName: teamName,
                newName,
                pin: teamPin,
              }),
            })
              .then((response) => response.json())
              .then((data) => {
                if (data.success) {
                  alert(data.message);
                } else {
                  alert("Name change failed: " + data.error);
                }
              });
          }
        });

      socket.on("disconnect", () => {
        reconnectionInterval = setInterval(attemptReconnection, 5000);
      });

      socket.on("connect", () => {
        clearInterval(reconnectionInterval);
        reRegister();
      });

      window.addEventListener("beforeunload", (e) => {
        e.preventDefault();
        e.returnValue = "";
      });

      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("portrait").catch(() => {});
      }
    </script>
  </body>
</html>
