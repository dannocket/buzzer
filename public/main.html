<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Buzzer - Main Screen</title>
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body class="page-main">
    <div id="result">Waiting for buzzer press...</div>
    <div id="pressesList"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="confetti.browser.js"></script>
    <script>
      const primaryNotificationVolume = 0.4;
      const secondaryNotificationVolume = 0.5;

      const waitingText = "Waiting for buzzer press...";
      const socket = io();
      const resultElement = document.getElementById("result");
      const pressesListElement = document.getElementById("pressesList");
      let buzzerSound = new Audio("buzzer.mp3");
      let subsequentBuzzerSound = new Audio("buzzer-2.mp3");
      let speechSynthesis = window.speechSynthesis;

      buzzerSound.volume = primaryNotificationVolume;
      subsequentBuzzerSound.volume = secondaryNotificationVolume;
      // Number of presses already rendered, so each new press sounds once.
      let knownPressCount = 0;

      function formatDate(date) {
        const hours = date.getHours();
        const minutes = date.getMinutes();
        const seconds = date.getSeconds();
        const milliseconds = date.getMilliseconds();
        const ampm = hours >= 12 ? "PM" : "AM";

        return `${hours % 12 || 12}:${minutes
          .toString()
          .padStart(2, "0")}:${seconds
          .toString()
          .padStart(2, "0")}.${milliseconds
          .toString()
          .padStart(3, "0")} ${ampm}`;
      }

      function updatePresses(presses) {
        pressesListElement.innerHTML = "";
        presses.forEach((press) => {
          const pressItem = document.createElement("div");
          pressItem.className = "pressItem";
          const date = new Date(press.timestamp);
          const teamNameElement = document.createElement("span");
          teamNameElement.textContent = press.teamName;
          const timestampElement = document.createElement("span");
          timestampElement.className = "timestamp";
          timestampElement.textContent = formatDate(date);
          pressItem.append(teamNameElement, timestampElement);
          pressesListElement.appendChild(pressItem);
        });

        // The first press has its own sound in buzzerPressed().
        if (presses.length > knownPressCount && presses.length > 1) {
          const audio = subsequentBuzzerSound.cloneNode(true);
          audio.volume = secondaryNotificationVolume;
          audio.play();
        }
        knownPressCount = presses.length;
      }

      function buzzerPressed({ teamName, description }) {
        resultElement.textContent = teamName;
        setTimeout(
          () => speak(teamName + (description ? ` - ${description}` : "")),
          1
        );
        confetti();
        buzzerSound.play();
      }

      // Restore the current round after a page reload or server reconnect,
      // without replaying sounds.
      socket.on("connect", async () => {
        const presses = await fetch("/history").then((response) =>
          response.json()
        );
        knownPressCount = presses.length;
        updatePresses(presses);
        resultElement.textContent = presses[0]?.teamName ?? waitingText;
      });

      socket.on("buzzerPressed", buzzerPressed);

      socket.on("updatePresses", updatePresses);

      socket.on("reset", () => {
        resultElement.textContent = waitingText;
        pressesListElement.innerHTML = "";
        knownPressCount = 0;
      });

      function speak(text) {
        const utterance = new SpeechSynthesisUtterance(text);
        speechSynthesis.speak(utterance);
      }
    </script>
  </body>
</html>
